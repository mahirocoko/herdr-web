name: CI
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  source-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      TZ: UTC
      UNIT_TEST_WORKERS: '1'
      UNIT_TEST_REPORT: .ci/unit-summary.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: HERDR_TEST_HOOKS=0 bun run build
      - name: Source unit suite only (no native preload)
        run: |
          mkdir -p .ci
          status=0
          bun run test > .ci/unit.log 2>&1 || status=$?
          tail -n 160 .ci/unit.log
          exit "$status"
      - name: Fetch fixed source reference, without activating upstream automation
        run: |
          git init .agent-state/learn/devswha/herdr-web-ui/origin
          git -C .agent-state/learn/devswha/herdr-web-ui/origin fetch --depth=1 https://github.com/devswha/herdr-web-ui d918448647e41079c52047ffc96cdaac50ccba32
      - run: bun run source:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-unit-evidence
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .ci/unit.log
            .ci/unit-summary.json
  windows-bootstrap:
    # T206 candidate: these native fixtures are not proof until this job actually runs.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      HERDR_TEST_MODE: unit
      UNIT_TEST_WORKERS: '1'
      HERDR_TEST_HOOKS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Focused bootstrap checks only (not full Windows unit/ACL coverage)
        run: bun scripts/bun-project.mjs test --preload ./scripts/test-herdr.ts ./scripts/bun-project.test.ts
      - name: Native NTFS privacy and equivalent launcher fixtures (no app or native host)
        run: bun scripts/bun-project.mjs test --preload ./scripts/test-herdr.ts ./scripts/private-filesystem.test.ts ./scripts/private-filesystem.windows.test.ts ./scripts/run-local.test.ts
      - name: Ordinary cmd entrypoint help, without Bash or WSL
        shell: cmd
        run: bun run start --help
      - name: Ordinary PowerShell entrypoint help, without Bash or WSL
        shell: powershell
        run: bun run start --help
      - name: Isolated production build, no app or native host
        run: bun run build --outDir .ci/windows-build
